# API do Contalexy atrás do nginx. O setup.sh troca __DOMAIN__ pelo domínio.
# O "upstream contalex_api" está em /etc/nginx/conf.d/contalex-upstream.conf e é
# o deploy.sh que o muda para a versão nova (azul ou verde).

limit_req_zone $binary_remote_addr zone=contalex_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Fotos de faturas e extratos (o backend também limita com MAX_UPLOAD_MB).
    client_max_body_size 20m;

    location / {
        limit_req zone=contalex_api burst=60 nodelay;
        proxy_pass http://contalex_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr já é o IP real do visitante (ver cloudflare-realip.conf).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # Se a versão em uso falhar a meio de um pedido GET, tenta outra vez.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
